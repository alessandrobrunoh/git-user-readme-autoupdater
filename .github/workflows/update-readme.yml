name: Update README

on:
  schedule:
    # Esegui ogni giorno alle 00:00 UTC
    - cron: '0 0 * * *'

  # Permette esecuzione manuale dal tab Actions
  workflow_dispatch:

  # Esegui anche quando viene pushato su main
  push:
    branches:
      - main
    paths:
      - 'config.yaml'
      - 'generate_readme.py'

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate README
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: python generate_readme.py

      - name: Check for changes
        id: verify_diff
        run: |
          git diff --quiet . || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.verify_diff.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git commit -m "🤖 Auto-update README with latest GitHub stats"
          git push

      - name: Create summary
        run: |
          echo "### ✅ README Updated Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Generated at: $(date)" >> $GITHUB_STEP_SUMMARY
