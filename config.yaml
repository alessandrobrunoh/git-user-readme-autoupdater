# GitHub Profile README Configuration Example
# Copy this file to config.yaml and customize it

profile:
  name: "Alessandro Bruno"
  description: |
    Full Stack Developer | Open Source Enthusiast | Tech Blogger
    Building the future, one commit at a time.

repositories:
  # Repositories to include (e.g., contributions to external projects)
  include:
    # - "octocat/Hello-World"

  # Repositories to exclude from your profile
  exclude:
    # - "yourusername/test-repo"
    # - "yourusername/old-experiment"

  # Pin specific repositories to fixed positions in Top 5
  # Format: repository-name: position (1-5)
  pinned:
    # "my-important-project": 1  # Always show as #1
    # "another-project": 2       # Always show as #2

languages:
  # Languages to exclude from statistics
  exclude:
    # - "HTML"
    - "CSS"

# Tech Stack configuration
tech_stack:
  # Add custom technologies/tools manually
  # These will be displayed alongside auto-detected ones
  custom:
    # - "PostgreSQL"
    # - "Docker"
    # - "Kubernetes"

# Top Repositories selection configuration
top_repos:
  # How many repositories to show
  count: 5

  # Selection strategy:
  # - 'language_proportional': Select repos proportionally based on language usage
  #   (e.g., if Rust is 78%, show ~4 Rust repos and ~1 Java repo)
  # - 'stars': Select top repos by stars only
  # - 'lines': Select top repos by lines of code only
  # - 'mixed': Mix of stars (60%) and lines (40%)
  strategy: "language_proportional"
